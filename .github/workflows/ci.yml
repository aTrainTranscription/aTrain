name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel in-progress runs on the same branch when a new push lands,
# except on the protected branches where every commit should produce a record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        # On pull_request the checkout is the PR merge commit, whose first
        # parent is the base branch. Depth 2 is enough to diff against it.
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect docs-only changes
        # The e2e jobs below take long and download models. A PR that only
        # touches Markdown or docs/ cannot change their outcome, so they skip.
        # Pushes to develop/main always run everything. A skipped job counts
        # as passed for required status checks.
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Own command, so a failing diff fails the job instead of skipping.
          files=$(git diff --name-only HEAD^1 HEAD)
          code=$(echo "$files" | grep -vE '(\.md$|^docs/)' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change, skipping e2e jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # New uv.lock invalidates the cache automatically.
          cache-dependency-glob: "uv.lock"

      - name: Install ruff
        # Lint needs only ruff, not the app runtime. --locked still checks
        # uv.lock against pyproject.toml.
        run: uv sync --locked --only-group dev --no-install-project

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  security:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install bandit
        # bandit scans source only, so the app runtime isn't needed.
        run: uv sync --locked --only-group dev --no-install-project

      - name: Bandit security scan
        run: uv run --no-sync bandit -r aTrain aTrain_core -c pyproject.toml

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit
        run: uv sync --locked --only-group dev --no-install-project

      - name: Audit locked dependencies for known CVEs
        # Non-gating for now: nicegui 2.21.1 / werkzeug 3.0.3 carry known CVEs
        # pending the coordinated upgrade in #159. Flip to gating once that
        # lands. The findings still print on every run for visibility.
        continue-on-error: true
        # Export the lock as a PEP 751 pylock.toml and audit it via --locked.
        # pip-audit checks each pinned package against the PyPI advisory DB and
        # self-documents anything it can't audit (the git aTrain_core dep, the
        # +cuXXX torch builds from the PyTorch index) in a "Skip Reason" table —
        # no manual filtering, no app-runtime build.
        run: |
          mkdir -p /tmp/audit
          uv export --format pylock.toml -o /tmp/audit/pylock.toml
          uv run --no-sync pip-audit /tmp/audit --locked

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Kept in step with release.yml, where the same versions are pinned - this
      # job is only worth anything if it exercises what the release uses.
      CYCLONEDX_BOM: "cyclonedx-bom==7.3.1"
      CYCLONEDX_LIB: "cyclonedx-python-lib[json-validation]==11.12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project without its dependencies
        # The release SBOM inventories the full runtime; this job only needs an
        # environment the project is installed into, so the builder has an
        # aTrain component to promote. Skipping torch keeps it at seconds.
        run: |
          uv venv
          uv pip install --no-deps .

      - name: Build and validate an SBOM
        # Guards the release path: without this, a change that breaks the
        # builder would only surface when a tag is pushed. The result is
        # discarded - what is being tested is that it can be produced and
        # conforms to the CycloneDX schema.
        run: |
          uvx --from "$CYCLONEDX_BOM" cyclonedx-py environment .venv \
            --output-format JSON --output-file raw-sbom.json
          uv run --no-project --with "$CYCLONEDX_LIB" \
            python .github/scripts/build-sbom.py \
              --input raw-sbom.json \
              --output sbom.json \
              --version 0.0.0-ci \
              --platform linux \
              --validate

  e2e:
    name: e2e (core pipeline)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install aTrain engine deps (CPU torch) + pytest
        # Smoke-tests the transcription engine only, so we install the project
        # without [gui] extras and force CPU torch from the PyTorch CPU index
        # (~1.5 GB vs ~7.5 GB for cu130/GTK). Post-monorepo-merge the engine
        # code lives in `aTrain_core/` inside this wheel, so a plain `.` install
        # picks it up alongside the engine deps in [project.dependencies].
        run: |
          uv venv
          uv pip install \
            . \
            "torch==2.9.1+cpu" "torchaudio==2.9.1+cpu" pytest pytest-asyncio \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Run transcription E2E smoke test
        run: .venv/bin/python -m pytest tests/core -v

  e2e-app:
    name: e2e (app, full stack)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GTK build deps for pywebview[GTK]
        # The full app pulls pywebview[GTK] on Linux, which builds pycairo /
        # pygobject against these system libs.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the full app runtime ([gui] extras) + pytest
        # The UI tests need the real `aTrain start` runtime, so this installs
        # the locked GTK/GUI stack — which also validates that the shipped
        # dependency set installs and imports. On a GPU-less runner the GUI
        # runs in browser mode. pytest is not an app dependency, so it is
        # added after the locked sync.
        run: |
          uv sync --locked --extra gui
          uv pip install pytest pytest-asyncio

      - name: Run E2E tests against the shipped stack (boot + transcribe)
        # Runs both suites on the locked cu128 stack: the UI boot smoke test
        # (tests/ui) and the transcription E2E (tests/core), so the shipped
        # dependency set is exercised end-to-end (boots AND transcribes), not
        # just installed. `uv run` puts .venv/bin on PATH for the `aTrain`
        # subprocess; --no-sync keeps the just-installed pytest in place.
        run: uv run --no-sync pytest tests/core tests/ui -v

  e2e-browser:
    name: e2e (real browser, Chromium)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GTK build deps for pywebview[GTK]
        # Same as e2e-app: the locked deps include pywebview[GTK] on Linux
        # even though we only run in browser mode here (--no-native). Keeps
        # the install path identical to the shipped stack.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install app runtime + pytest + Playwright
        run: |
          uv sync --locked --extra gui
          uv pip install pytest pytest-playwright

      - name: Install Playwright browsers (Chromium only for PoC)
        # --with-deps pulls the system libs Playwright's Chromium needs on
        # Ubuntu. Only Chromium for the PoC; adding WebKit / Firefox is a
        # separate follow-up matrix entry.
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run real-browser e2e tests
        # Uses the same `aTrain start --no-native` subprocess pattern as the
        # boot smoke, plus Playwright's Chromium driving it. See
        # tests/e2e_browser/conftest.py for the fixture.
        run: uv run --no-sync pytest tests/e2e_browser -v

  macos-app-start:
    name: macOS startup (macOS 15)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Match the release build, without signing secrets or notarization.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ATRAIN_VERSION: "0.0.0-ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        # The python.org framework build. Without it uv picks the runner's
        # Homebrew Python, whose libraries require the runner's macOS version.
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the full app runtime
        # --no-dev matches the release runtime. --python only here: the .venv it creates
        # is then used by every later uv call (a job-wide UV_PYTHON would make
        # `uv pip install` target the system Python instead).
        shell: bash
        run: |
          uv sync --locked --extra gui --no-dev --python "${{ steps.python.outputs.python-path }}" \
            --python-platform aarch64-apple-darwin

      - name: Install PyInstaller
        shell: bash
        run: uv pip install pyinstaller

      - name: Build the frozen app with PyInstaller
        # The log is kept (and uploaded even on failure) to debug missing
        # imports and data files.
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pyinstaller macos_freeze.spec --noconfirm 2>&1 | tee pyinstaller-macos.log

      - name: Smoke test - the app starts
        # Not --help: the frozen entry point ignores arguments and starts the GUI.
        # `script` gives the app a pty, so its stdout is line-buffered (a frozen
        # app ignores PYTHONUNBUFFERED). Wait for the frontend to connect, the
        # deferred runtime imports to finish, and the root page to be built.
        env:
          ATRAIN_USER_DIR: ${{ runner.temp }}/atrain-startup
        shell: bash
        run: |
          set -euo pipefail
          script -q app-start.log dist/aTrain.app/Contents/MacOS/aTrain > /dev/null 2>&1 &
          pid=$!
          status=0
          sleep 60
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::App exited during startup"
            status=1
          elif grep -Eq "aTrain startup failed|Traceback \(most recent call last\):" app-start.log; then
            echo "::error::App initialization failed"
            status=1
          elif ! grep -q "^aTrain startup ready" app-start.log; then
            echo "::error::App did not finish initializing the main page"
            status=1
          fi
          pkill -P "$pid" || true
          kill "$pid" 2>/dev/null || true
          echo "--- app-start.log ---"
          cat app-start.log
          exit "$status"

      - name: Archive the app for the macOS 27 check
        # Zip with ditto so the bundle's symlinks and permissions survive upload.
        shell: bash
        run: ditto -c -k --keepParent dist/aTrain.app aTrain-macos-test.zip

      - name: Upload the test app
        uses: actions/upload-artifact@v7
        with:
          name: aTrain-macos-test
          path: aTrain-macos-test.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload startup and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos15-startup-logs
          path: |
            pyinstaller-macos.log
            build/macos_freeze/warn-macos_freeze.txt
            app-start.log
          if-no-files-found: ignore

  macos27-app-start:
    # Check the same app built on macOS 15 against the newer loader.
    name: macOS startup (macOS 27)
    needs: macos-app-start
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Download the test app
        uses: actions/download-artifact@v8
        with:
          name: aTrain-macos-test

      - name: Extract the app
        shell: bash
        run: |
          sw_vers
          ditto -x -k aTrain-macos-test.zip "$RUNNER_TEMP"

      - name: Smoke test - no scipy < 1.17.1
        # scipy < 1.17.1 ships PROPACK as _propack/_?propack*.so, which the
        # macOS 27.0.1 loader rejects.
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/aTrain.app" -type d -path '*/scipy/sparse/linalg/_propack' | grep -q .; then
            echo "::error::Bundle contains scipy < 1.17.1 (scipy/sparse/linalg/_propack/)"
            exit 1
          fi

      - name: Smoke test - the app starts
        # Not --help: the frozen entry point ignores arguments and starts the GUI.
        # `script` gives the app a pty, so its stdout is line-buffered (a frozen
        # app ignores PYTHONUNBUFFERED). Wait for the frontend to connect, the
        # deferred runtime imports to finish, and the root page to be built.
        env:
          ATRAIN_USER_DIR: ${{ runner.temp }}/atrain-startup
        shell: bash
        run: |
          set -euo pipefail
          script -q app-start.log "$RUNNER_TEMP/aTrain.app/Contents/MacOS/aTrain" > /dev/null 2>&1 &
          pid=$!
          status=0
          sleep 60
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::App exited during startup"
            status=1
          elif grep -Eq "aTrain startup failed|Traceback \(most recent call last\):" app-start.log; then
            echo "::error::App initialization failed"
            status=1
          elif ! grep -q "^aTrain startup ready" app-start.log; then
            echo "::error::App did not finish initializing the main page"
            status=1
          fi
          pkill -P "$pid" || true
          kill "$pid" 2>/dev/null || true
          echo "--- app-start.log ---"
          cat app-start.log
          exit "$status"

      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos27-startup-logs
          path: app-start.log
          if-no-files-found: ignore

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install unit-test deps (no torch, no GTK)
        # The unit tests cover only torch- and NiceGUI-free helpers
        # (aTrain/utils/archive.py, aTrain_core/integrity.py and the model
        # resolution around it), so we skip the heavy app runtime entirely.
        # Post-monorepo-merge aTrain_core ships inside this wheel; `--no-deps .`
        # installs both top-level packages without pulling torch/pyannote, plus
        # the few light libraries those modules import, plus pytest. All of it
        # is pure Python and stays in seconds.
        # `shell: bash` so the `\` line-continuations work on windows-latest too
        # (default Windows shell is pwsh, which uses backtick instead).
        shell: bash
        run: |
          uv venv
          uv pip install --no-deps .
          uv pip install platformdirs pyyaml show-in-file-manager huggingface_hub pytest

      - name: Run unit tests
        # `uv run --no-sync` finds the venv we just built and invokes python
        # cross-platform (no `.venv/bin` vs `.venv/Scripts` split). `python -m
        # pytest` (rather than bare `pytest`) is required so cwd is added to
        # sys.path — the tests import `aTrain` from the repo root, which is
        # not installed as a package in this job.
        run: uv run --no-sync python -m pytest tests/unit -v
